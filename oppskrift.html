<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8" />

       tests/security-headers.test.js holder dem like. Siden har ingen inline-kode. -->
  <meta http-equiv="Content-Security-Policy" content="
    default-src 'none';
    base-uri 'none';
    object-src 'none';
    script-src 'self' 'sha256-6Q3JDVUTmctJuF9ScsOY9kCKBmqaIbjWdZMf/B2lgNc=';
    style-src 'self' 'sha256-E7zJXfkufcgTIQG1Th6iYnoGis+rTfZd044bgiM1kr4=';
    font-src 'self';
    img-src 'self' data: blob:;
    connect-src 'self' https://bmkynefxgklxzcofflqu.supabase.co wss://bmkynefxgklxzcofflqu.supabase.co https://huskis.no;
    worker-src 'self';

  " />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#667788" />
  <!-- En delt oppskrift er ikke en offentlig nettside: den skal ikke indekseres. -->
  <meta name="robots" content="noindex, nofollow" />
  <title>Huskis</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <link rel="stylesheet" href="styles.css" />
  <script src="theme.js"></script>
</head>
<!-- DEN OFFENTLIGE LESEVISNINGEN for en delt kokebok, et kapittel eller en
     oppskrift: oppskrift.html#<nøkkel>. Kun lesing, ingen innlogging. Alt
     innhold tegnes av recipe-public.js med den samme lesevisningen som appen
     (recipe-core.js). Se docs/oppskrifter.md. -->
<body class="pub-page">
  <!-- Toppmenyen: Tilbake (bare inne i en oppskrift fra en bok eller et
       kapittel), Huskis-merket i midten som lenke til huskis.no, drakten til
       høyre. Lenkene får adressen fra config.js (recipe-public.js). -->
  <header class="note-editor-bar pub-bar">
    <span class="pub-bar-start">
      <button class="btn btn-ghost btn-small pub-back" id="pub-back" type="button" hidden>
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5 8 12l7 7"></path></svg>
        <span data-i18n="public.back">Tilbake</span>
      </button>
    </span>
    <a class="pub-brand pub-home" href="https://huskis.no">
      <img class="pub-logo" src="favicon.svg" alt="" width="30" height="30" />
      <span class="pub-brand-name">Huskis</span>
    </a>
    <span class="note-editor-aside pub-bar-end">
      <button class="corner-btn note-editor-btn" id="pub-theme" type="button"></button>
    </span>
  </header>
  <main class="note-editor-body pub-main" id="pub-main" aria-live="polite" aria-busy="true">
    <p class="pub-loading" data-i18n="public.loading">Henter …</p>
  </main>
  <!-- Invitasjonen nederst, bare for den som ikke er logget inn i Huskis.
       Lukkes med ×, og forblir lukket (recipe-public.js). -->
  <aside class="pub-invite" id="pub-invite" hidden>
    <div class="pub-invite-text">
      <p class="pub-invite-title" id="pub-invite-title"></p>
      <p class="pub-invite-sub" data-i18n="public.inviteText">Lag lister, notater og oppskrifter, og del dem med andre.</p>
    </div>
    <a class="btn btn-solid btn-green btn-small pub-invite-cta pub-home" href="https://huskis.no"
       data-i18n="public.inviteCta">Meld deg inn nå</a>
    <button class="icon-btn pub-invite-close" id="pub-invite-close" type="button"
            data-i18n-title="public.inviteClose" data-i18n-aria-label="public.inviteClose">×</button>
  </aside>

  <script src="vendor/supabase-js-2.111.0.js"></script>
  <script src="config.js"></script>
  <!-- huskis:kun-dev:start — mock-backenden (?mock=1), som i index.html. Fjernes
       av build.js sammen med filene den peker på. -->
  <script src="dev-mock.js"></script>
  <!-- huskis:kun-dev:slutt -->
  <script src="icons.js"></script>
  <script src="i18n.js"></script>
  <script src="recipe-core.js"></script>
  <script src="recipe-public.js"></script>
</body>
</html>
