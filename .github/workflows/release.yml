name: Release

# ============================================================
# Rekkefølgen som gjør databaseendringer trygge:
#
#   1. tester    — hele suiten (JS + SQL), samme jobber som på PR-en
#   2. migrering — setup.sql + users-and-sharing.sql mot produksjonsdatabasen
#   3. smoke     — supabase/smoke-test.sql: finnes og VIRKER alt klienten
#                  trenger (tabeller, kolonner, funksjoner, RPC-er, RLS)?
#   4. deploy    — FØRST nå bygges og publiseres frontenden på Vercel
#
# Hvert ledd `needs` det forrige, så en frontend som avhenger av nye
# databaseendringer kan ikke nå produksjon før migreringen er fullført OG
# verifisert. Feiler ledd 2 eller 3, skjer ledd 4 aldri: produksjon fortsetter
# å servere den forrige frontenden, som fungerer mot det (additivt) migrerte
# skjemaet.
#
# Vercels egen git-deploy for `main` er slått AV i vercel.json
# (`git.deploymentEnabled.main = false`). Det er DEN mekanismen som hindrer at
# deploy og migrering kjører parallelt — produksjonsdeployen har bare én vei
# inn, og den går gjennom denne workflowen. Preview-deploys for andre grener
# er uberørt.
#
# Feil, retry og rollback: se docs/release-og-deploy.md.
#
# Krever repository-secrets:
#   SUPABASE_DB_URL  — Supabase → Project Settings → Database → Connection
#                      string → URI (med passordet satt inn)
#   VERCEL_TOKEN     — Vercel → Account Settings → Tokens
#   VERCEL_ORG_ID    — fra .vercel/project.json etter `vercel link`
#   VERCEL_PROJECT_ID— samme sted
# ============================================================

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      hopp_over_deploy:
        description: 'Kjør kun migrering + smoke-test (ingen produksjonsdeploy)'
        type: boolean
        default: false

concurrency:
  # ÉN release om gangen. Gruppen deles av push og manuell kjøring, så en
  # migrering aldri kan overlappe med en deploy eller en annen migrering.
  # `cancel-in-progress: false`: en pågående release får alltid gjøre seg ferdig
  # — å avbryte midt i en DDL er nettopp det vi vil unngå.
  group: huskis-release
  cancel-in-progress: false

permissions:
  contents: read

env:
  # Vercel CLI-en er LÅST til en eksakt versjon. Med `@latest` kunne en ny
  # CLI-utgivelse endre deployen uten at repoet endret seg — og utgivelsene
  # kommer tett (to hovedversjoner på ti dager sommeren 2026). En deploy skal
  # være reproduserbar: samme commit inn, samme oppførsel ut.
  #
  # OPPGRADERING: bump tallet her, kjør `npm install -g vercel@<ny>` og
  # kontroller at `vercel deploy --help` fortsatt har `--prod`, `--build-env`
  # og `--token` (det er alle flaggene denne workflowen bruker). Slipp den
  # gjennom en PR først: preview-deployen for grenen kjører hos Vercel og
  # rører ikke denne versjonen, så den ekte prøven er den første releasen
  # etter merge. Går den i bakken, er rollback å sette tallet tilbake.
  # `tests/release-pipeline.test.js` vokter at det ER en eksakt versjon.
  VERCEL_CLI_VERSION: '58.5.1'

jobs:
  # ---- 1. Tester ------------------------------------------------------
  tester:
    name: Tester
    uses: ./.github/workflows/ci.yml

  # ---- 2. Migrering ---------------------------------------------------
  migrering:
    name: Migrering
    needs: tester
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Kjør SQL-filene mot produksjonsdatabasen
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          if [ -z "$SUPABASE_DB_URL" ]; then
            echo "::error::Mangler secret SUPABASE_DB_URL. Legg den til under Settings → Secrets and variables → Actions."
            exit 1
          fi
          # Migreringen kjører mot en LEVENDE database: appen poller get_my_doc
          # hvert 5. sekund, og en slik lesning kan havne i en låsesyklus med
          # DDL-en (som tar AccessExclusiveLock). Det skjedde 2026-08-01 —
          # «deadlock detected» midt i filen, og produksjonen ble stående
          # halvmigrert (roller på plass, capabilities-funksjonene ikke).
          #
          # Begge filene er idempotente, så den riktige responsen er å prøve på
          # nytt, ikke å stoppe halvveis. `lock_timeout` gjør at en DDL som blir
          # stående og vente gir opp raskt i stedet for å holde på låsene sine
          # mens køen bygger seg opp bak.
          export PGOPTIONS='-c lock_timeout=15s'
          run_sql() {
            local fil="$1" forsok=1
            until psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -f "$fil"; do
              if [ "$forsok" -ge 3 ]; then
                echo "::error::$fil feilet etter $forsok forsøk."
                return 1
              fi
              echo "::warning::$fil feilet (forsøk $forsok) — prøver igjen om $((forsok * 10)) s."
              sleep $((forsok * 10))
              forsok=$((forsok + 1))
            done
          }
          run_sql supabase/setup.sql
          run_sql supabase/users-and-sharing.sql
          echo "✅ Migreringen er kjørt (legacy-synk + brukere/deling)."

  # ---- 3. Smoke-test --------------------------------------------------
  smoke:
    name: Smoke-test
    needs: migrering
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Verifiser at databasen er klar for den nye klienten
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          if [ -z "$SUPABASE_DB_URL" ]; then
            echo "::error::Mangler secret SUPABASE_DB_URL."
            exit 1
          fi
          # Read-only og transaksjonell (se toppen av smoke-test.sql) — trygg
          # mot produksjon med brukere innlogget. Ingen retry: enten er skjemaet
          # riktig, eller så skal deployen stoppe.
          if ! psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -f supabase/smoke-test.sql; then
            echo "::error::Smoke-testen feilet — produksjonsdeployen stoppes. Databasen er ikke klar for denne frontenden. Se docs/release-og-deploy.md."
            exit 1
          fi

  # ---- 4. Produksjonsdeploy -------------------------------------------
  deploy:
    name: Produksjonsdeploy (Vercel)
    needs: smoke
    if: ${{ github.event_name == 'push' || inputs.hopp_over_deploy != true }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Sjekk at Vercel-secretene finnes
        run: |
          for s in VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID; do
            if [ -z "${!s}" ]; then
              echo "::error::Mangler secret $s. Uten den kan ingenting deployes til produksjon (Vercels git-deploy for main er slått av i vercel.json). Se docs/release-og-deploy.md."
              exit 1
            fi
          done
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

      # Vercel svarer «Could not retrieve Project Settings» på ALT som går galt
      # her — ugyldig token, token uten tilgang, feil prosjekt-ID. Vi spør API-et
      # selv først, slik at feilen sier hva som faktisk er i veien. Kun
      # HTTP-statusen og en feilmelding fra Vercel logges; tokenet forlater
      # aldri runneren.
      - name: Preflight — når tokenet prosjektet?
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          # `|| status=000`: steget kjører med `bash -e`, så en curl som feiler
          # på nettverket ville avbrutt her — før case-blokken fikk forklart
          # noe. Da får vi heller 000 og går i nettverksgrenen med en melding.
          #
          # Tidsgrensene er en del av den samme sikringen: curl har INGEN
          # standard grense for selve overføringen, så et API som tar imot
          # forbindelsen og deretter tier ville hengt til jobbens timeout på 15
          # minutter — og aldri nådd 000-grenen. Da hadde diagnostikken
          # avvæpnet seg selv i nettopp det tilfellet den finnes for.
          status=$(curl -sS --connect-timeout 10 --max-time 30 \
            -o /tmp/vc.json -w '%{http_code}' \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v9/projects/$VERCEL_PROJECT_ID?teamId=$VERCEL_ORG_ID") \
            || status=000
          melding=$(jq -r '.error.message // empty' /tmp/vc.json 2>/dev/null || true)
          case "$status" in
            200) echo "✅ Tokenet leser prosjektet «$(jq -r .name /tmp/vc.json)»." ;;
            000) echo "::error::Fikk ikke kontakt med api.vercel.com. Nettverksfeil på runneren — kjør jobben på nytt."; exit 1 ;;
            401) echo "::error::VERCEL_TOKEN er ugyldig eller utløpt (401). Lag et nytt på https://vercel.com/account/settings/tokens og oppdater secreten. ${melding}"; exit 1 ;;
            403) echo "::error::VERCEL_TOKEN har ikke tilgang til dette prosjektet (403). Tokenets scope må dekke prosjektet «huskis» — enten team-scope (peohols-projects) eller project-scope (peohols-projects/huskis). ${melding}"; exit 1 ;;
            404) echo "::error::Fant ikke prosjektet (404). VERCEL_PROJECT_ID og VERCEL_ORG_ID hører ikke sammen, eller peker på noe som ikke finnes. ${melding}"; exit 1 ;;
            *)   echo "::error::Uventet svar fra Vercel ($status). ${melding}"; exit 1 ;;
          esac

      - name: Installer den låste Vercel CLI-en
        run: |
          npm install -g "vercel@${VERCEL_CLI_VERSION}"
          # Bevis at det er DEN versjonen som kjører — en npm-cache eller et
          # forhåndsinstallert globalt CLI kunne ellers gitt en annen.
          faktisk=$(vercel --version | tail -1 | tr -d '[:space:]')
          if [ "$faktisk" != "$VERCEL_CLI_VERSION" ]; then
            echo "::error::Vercel CLI er $faktisk, ikke den låste $VERCEL_CLI_VERSION."
            exit 1
          fi
          echo "✅ Vercel CLI $faktisk (låst)."

      # Peker CLI-en på riktig prosjekt. `vercel deploy` trenger bare disse to
      # ID-ene; det er `vercel build` som i tillegg krever en `settings`-blokk
      # som kun `vercel pull` skriver — og derfor bygger vi ikke lokalt.
      - name: Lenk prosjektet
        run: |
          mkdir -p .vercel
          printf '{"projectId":"%s","orgId":"%s"}\n' \
            "$VERCEL_PROJECT_ID" "$VERCEL_ORG_ID" > .vercel/project.json

      # Builden kjører HOS Vercel, ikke her — altså nøyaktig som da
      # git-integrasjonen deployet main, bare startet fra denne jobben i stedet.
      # Det er med vilje: `vercel pull` + `vercel build --prebuilt` krever at
      # runneren har hele prosjektkonfigurasjonen liggende lokalt, og å gjette
      # den fasongen selv er en kilde til feil vi ikke trenger. Vercel kjenner
      # sine egne innstillinger, og `vercel.json` i det opplastede treet gir
      # `buildCommand: node build.js` + `outputDirectory: dist`.
      #
      # Porten står like fast: jobben ligger bak `needs: smoke`, så
      # opplastingen skjer først etter at migreringen er verifisert.
      #
      # `--build-env GITHUB_SHA`: build.js leser den som fallback for `commit` i
      # /version.json. Uten den har Vercel-builden ingen git-metadata å stemple
      # med, siden treet lastes opp fra CLI-en og ikke hentes fra GitHub.
      - name: Bygg og publiser til produksjon
        run: |
          url=$(vercel deploy --prod \
            --build-env "GITHUB_SHA=$GITHUB_SHA" \
            --token="$VERCEL_TOKEN")
          echo "✅ Produksjonsdeploy: $url"
          {
            echo "### Produksjonsdeploy"
            echo "$url"
          } >> "$GITHUB_STEP_SUMMARY"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          GITHUB_SHA: ${{ github.sha }}
