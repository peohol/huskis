name: Android debug-APK

# Bygger en installérbar debug-APK av den vanlige webbuilden og laster den opp
# som artifact, slik at fysisk testing på telefon ikke krever Android Studio
# lokalt. Kjeden er nøyaktig den samme som lokalt (docs/mobilapp-plan.md):
#
#   node build.js  →  dist/  →  cap sync android  →  gradlew assembleDebug
#
# Ingen signering, ingen release-AAB og ingen butikkopplasting — dette er en
# debugbuild med Androids standard debug-nøkkel.
#
# Jobben laster opp to artifacts: APK-en, og det SAMMENSLÅTTE Android-manifestet
# med merger-rapporten — den ene filen som viser hva de native bibliotekene drar
# med seg inn i appens eget manifest (siste steg).
#
# Trigger: manuelt (workflow_dispatch), og automatisk på de pull requestene som
# faktisk kan gjøre APK-en ugyldig. Vanlige Huskis-PR-er som bare rører app.js,
# styles.css eller docs/ skal ikke betale for en Gradle-runde; det de endrer
# ligger i `dist/`, som denne workflowen uansett bare pakker inn.

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'android/**'
      - 'capacitor.config.json'
      - 'package.json'
      - 'package-lock.json'
      - 'build.js'
      - '.github/workflows/android-debug.yml'
      # Testen selv: den har sjekker som BARE kjører etter `cap sync` (den
      # genererte konfigurasjonen, de kopierte web-assetene). Den vanlige
      # node-runden kjører i et rent utsjekk der de grenene hopper over seg
      # selv, så en PR som bare rører denne fila ville endret dem uten at noen
      # jobb kjørte dem.
      - 'tests/capacitor-android.test.js'
      - 'tests/notif-timezone-native.test.js'

concurrency:
  group: android-debug-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  apk:
    name: Debug-APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # Samme Node-versjon som resten av CI. Capacitor 8 krever Node 22+.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      # Capacitors Android-prosjekt kompilerer mot Java 21
      # (`sourceCompatibility` i @capacitor/android).
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # `npm ci` bygger node_modules fra package-lock.json alene — ingen
      # versjonsdrift mellom denne kjøringen og neste.
      - name: Installer npm-avhengighetene reproduserbart
        run: npm ci

      # Nøyaktig samme steg som Vercel kjører. APK-en får altså den samme
      # webbuilden som huskis.no, ikke en egen mobilvariant.
      - name: Bygg webappen
        run: node build.js

      - name: Kopier dist/ inn i Android-prosjektet
        run: npx cap sync android

      # `cap sync` GENERERER android/app/src/main/assets/capacitor.config.json —
      # kopien som faktisk pakkes i APK-en. Den finnes ikke i et rent utsjekk,
      # så sjekken av den hopper over seg selv i den vanlige node-runden
      # (ci.yml). Her, og bare her, finnes filen: testen kjøres derfor på nytt
      # etter synkroniseringen, slik at et generasjonssteg som skulle legge
      # `server.allowNavigation` inn i den pakkede konfigurasjonen faktisk
      # feller CI. `tests/capacitor-android.test.js` vokter at dette steget står
      # her.
      - name: Verifiser den GENERERTE Capacitor-konfigurasjonen
        run: node tests/capacitor-android.test.js

      # Runneren har Android SDK-en forhåndsinstallert, men ikke nødvendigvis
      # akkurat den plattformen prosjektet kompilerer mot. Nivået leses fra
      # android/variables.gradle, så de to aldri kan komme i utakt.
      - name: Installer SDK-plattformen prosjektet kompilerer mot
        run: |
          set -euo pipefail
          sdk="$(grep -oE 'compileSdkVersion[[:space:]]*=[[:space:]]*[0-9]+' android/variables.gradle | grep -oE '[0-9]+')"
          echo "compileSdkVersion=$sdk"
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          # `yes` dør av SIGPIPE i det sdkmanager slutter å lese. Med `pipefail`
          # ville den døden blitt lest som at lisensgodkjenningen feilet, så den
          # er av akkurat her: statusen som betyr noe er sdkmanagers egen, og
          # uten pipefail er det nettopp den som blir pipelinens exit-kode.
          set +o pipefail
          yes | "$sdkmanager" --licenses > /dev/null
          set -o pipefail
          "$sdkmanager" "platforms;android-$sdk"

      # Det native laget har én ting JS ikke kan prøve: at en alarm som alt er
      # planlagt flytter seg til riktig LOKAL veggtid når telefonen bytter
      # tidssone mens Huskis er lukket (docs/varsler.md). Omregningen er ren
      # Java og kjører derfor på JVM-en, uten emulator — men den må faktisk
      # KJØRES, ellers er den bare en fil. `tests/notif-timezone-native.test.js`
      # vokter at dette steget står her.
      - name: Kjør de native enhetstestene
        working-directory: android
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Bygg debug-APK
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: huskis-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      # Hva de native AAR-ene drar med seg INN i appens manifest er det siste
      # åpne punktet i fase 5 som ikke krever en telefon (docs/mobilapp-plan.md).
      # `tests/capacitor-android.test.js` sier det selv: manifestet inne i en AAR
      # kan ikke leses fra repoet, så det som kan låses der er HVILKE biblioteker
      # som finnes — ikke hva hvert av dem erklærer. Den sammenslåtte fila er
      # derimot Gradle-output, og den finnes nøyaktig her. Den skrives derfor ut
      # i loggen og lastes opp sammen med merger-rapporten, som attribuerer hver
      # eneste node til fila den kom fra. Steget må stå ETTER `assembleDebug` —
      # før den kjørte finnes ingen sammenslåing.
      - name: Les det sammenslåtte Android-manifestet
        working-directory: android
        run: |
          set -euo pipefail
          ut=app/build/outputs/merged-manifest
          rapport=app/build/outputs/logs/manifest-merger-debug-report.txt
          # `-print -quit` i stedet for `| head -1`: en pipe som lukkes tidlig
          # dreper `find` med SIGPIPE, og med `pipefail` ville den døden blitt
          # lest som at søket feilet.
          merged="$(find app/build/intermediates -path '*merged_manifest*/debug/*' -name AndroidManifest.xml -print -quit)"
          if [ -z "$merged" ]; then
            echo "Fant ikke det sammenslåtte manifestet under app/build/intermediates" >&2
            exit 1
          fi
          mkdir -p "$ut"
          cp "$merged" "$ut/AndroidManifest.xml"
          echo "== $merged =="
          cat "$ut/AndroidManifest.xml"
          # Rapporten er provenansen — hvilken fil som la inn hva — og den skal
          # ikke kunne felle APK-byggingen: manifestet over er svaret, rapporten
          # er begrunnelsen.
          if [ -f "$rapport" ]; then
            cp "$rapport" "$ut/"
            echo "== $rapport =="
            cat "$ut/manifest-merger-debug-report.txt"
          else
            echo "== ingen manifest-merger-rapport i denne Gradle-versjonen =="
          fi
          # Og til slutt konklusjonen de to filene over bærer, i lesbar form:
          # hva APK-en faktisk ERKLÆRER. `exported` står med fordi det er den
          # ene egenskapen som avgjør om en komponent et bibliotek la inn kan
          # nås utenfra. Leses med en XML-parser, ikke med grep: AGP skriver det
          # sammenslåtte manifestet med ett attributt per linje, så et
          # linjebasert søk ville sett forbi halvparten. `exported` og
          # `permission` står sammen fordi det er de to som til sammen avgjør
          # om en komponent kan nås utenfra — den ene alene svarer ikke.
          python3 - "$ut/AndroidManifest.xml" <<'PY'
          import sys, xml.etree.ElementTree as ET
          NS = '{http://schemas.android.com/apk/res/android}'
          rot = ET.parse(sys.argv[1]).getroot()
          navn = lambda e: e.get(NS + 'name', '(uten navn)')
          print('== oppsummering: hva det bygde manifestet erklærer ==')
          for tagg in ('uses-permission', 'permission'):
              for e in rot.findall(tagg):
                  print(tagg + ': ' + navn(e))
          app = rot.find('application')
          for e in (list(app) if app is not None else []):
              if e.tag in ('activity', 'service', 'receiver', 'provider'):
                  print(e.tag + ': ' + navn(e)
                        + '  exported=' + e.get(NS + 'exported', '(usatt)')
                        + '  permission=' + e.get(NS + 'permission', '(ingen)'))
                  for md in e.findall('meta-data'):
                      print('    meta-data: ' + navn(md))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: huskis-merged-manifest
          path: android/app/build/outputs/merged-manifest
          if-no-files-found: error
